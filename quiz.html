<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kellerquiz – Live</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; margin: 0; }
        body {
            font-family: system-ui, 'Segoe UI', sans-serif;
            background: #1e2a3a;
            padding: 20px;
            color: #ecf0f1;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        .card {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border-radius: 32px;
            padding: 20px;
            margin-bottom: 20px;
        }
        button {
            background: #e67e22;
            border: none;
            border-radius: 40px;
            padding: 10px 20px;
            font-weight: bold;
            cursor: pointer;
            color: white;
            margin: 5px;
        }
        input, textarea {
            background: rgba(255,255,255,0.2);
            border: none;
            border-radius: 40px;
            padding: 10px 16px;
            color: white;
            width: 100%;
            margin: 10px 0;
        }
        .flex { display: flex; gap: 15px; flex-wrap: wrap; align-items: center; }
        .player-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px,1fr)); gap: 10px; margin-top: 15px; }
        .player-card { background: #2c3e50; border-radius: 20px; padding: 10px; text-align: center; }
        .log { background: #00000055; border-radius: 16px; padding: 10px; font-family: monospace; margin-top: 10px; white-space: pre-wrap; }
        .hidden { display: none; }
        .question { font-size: 1.4rem; margin: 20px 0; }
    </style>
</head>
<body>
<div class="container" id="app">
    <div class="card">
        <div class="flex">
            <h1>📜 KELLERQUIZ</h1>
            <div id="mode-badge"></div>
        </div>
        <div id="content">Lade...</div>
        <div id="log" class="log"></div>
    </div>
</div>

<script>
    // Supabase – deine Zugangsdaten
    const SUPABASE_URL = 'https://xvnhtfmedzjblinchzmt.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_8wS4n-07wc2SCmniuTdYmA_uRIlNE4z';
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // URL-Parameter auslesen: ?view=host oder ?view=join
    const urlParams = new URLSearchParams(window.location.search);
    const view = urlParams.get('view') || 'host';  // default: host

    let currentSessionId = null;
    let currentPlayerId = null;

    function log(msg) {
        const logDiv = document.getElementById('log');
        logDiv.innerHTML += new Date().toLocaleTimeString() + ': ' + msg + '<br>';
        console.log(msg);
    }

    // ==================== HOST-ANSICHT ====================
    async function renderHost() {
        document.getElementById('mode-badge').innerHTML = '<strong>🎤 HOST-MODUS</strong>';
        const content = document.getElementById('content');
        content.innerHTML = `
            <div class="card">
                <h2>1. Session starten</h2>
                <input type="text" id="session-name" placeholder="Quiz-Name (z.B. 'Kellerabend')">
                <button id="create-session">✨ Neue Session erstellen</button>
                <div id="qr-area"></div>
            </div>
            <div class="card" id="upload-card" style="display:none;">
                <h2>2. Fragen laden (Excel)</h2>
                <input type="file" id="excel-file" accept=".xlsx,.xls,.csv">
                <button id="upload-excel">📂 Hochladen</button>
                <div id="upload-status"></div>
            </div>
            <div class="card" id="players-card" style="display:none;">
                <h2>👥 Spieler <span id="player-count">(0)</span></h2>
                <div id="players-list" class="player-list"></div>
                <button id="next-question" style="background:#2ecc71;">➡️ Nächste Frage</button>
            </div>
            <div class="card" id="question-card" style="display:none;">
                <h2 id="question-text">Frage</h2>
                <div id="question-image"></div>
                <div id="answers-list" class="player-list" style="max-height:200px; overflow:auto;"></div>
                <button id="evaluate" style="background:#f39c12;">📊 Auswerten</button>
            </div>
        `;

        // Session erstellen
        document.getElementById('create-session').onclick = async () => {
            const name = document.getElementById('session-name').value || "Quiz";
            try {
                const { data, error } = await supabase
                    .from('quiz_sessions')
                    .insert({ name: name, active: true })
                    .select()
                    .single();
                if (error) throw error;
                currentSessionId = data.id;
                localStorage.setItem('quiz_session', currentSessionId);
                log(`✅ Session erstellt: ${currentSessionId}`);
                const joinUrl = window.location.href.split('?')[0] + '?view=join&session=' + currentSessionId;
                document.getElementById('qr-area').innerHTML = `
                    <p>📲 QR-Code-Link: <a href="${joinUrl}" target="_blank">${joinUrl}</a></p>
                    <p>Teile diesen Link mit den Spielern.</p>
                `;
                document.getElementById('upload-card').style.display = 'block';
                document.getElementById('players-card').style.display = 'block';
                loadPlayers();
                subscribePlayers();
            } catch (err) {
                log(`❌ Fehler: ${err.message}`);
            }
        };

        // Excel-Upload (vereinfacht)
        document.getElementById('upload-excel').onclick = async () => {
            const file = document.getElementById('excel-file').files[0];
            if (!file) return alert("Bitte Datei auswählen");
            // Achtung: XLSX-Bibliothek nicht eingebunden – wir machen erstmal nur eine Meldung
            alert("Excel-Upload wird später eingebaut – bitte vorerst die Testfragen direkt in der Datenbank anlegen.");
            document.getElementById('upload-status').innerHTML = "Demo: Bitte nutze den SQL-Editor für erste Fragen.";
        };

        async function loadPlayers() {
            if (!currentSessionId) return;
            const { data } = await supabase.from('quiz_players').select('*').eq('session_id', currentSessionId);
            const container = document.getElementById('players-list');
            container.innerHTML = (data || []).map(p => `<div class="player-card">${p.player_name} - ${p.total_score} Punkte</div>`).join('');
            document.getElementById('player-count').innerText = (data || []).length;
        }
        function subscribePlayers() {
            supabase.channel('players').on('postgres_changes', { event: '*', schema: 'public', table: 'quiz_players', filter: `session_id=eq.${currentSessionId}` }, () => {
                loadPlayers();
            }).subscribe();
        }
    }

    // ==================== SPIELER-ANSICHT ====================
    async function renderJoin() {
        const sessionId = urlParams.get('session');
        if (!sessionId) {
            document.getElementById('content').innerHTML = '<p>❌ Keine Session-ID in der URL. Bitte QR-Code scannen.</p>';
            return;
        }
        currentSessionId = sessionId;
        document.getElementById('mode-badge').innerHTML = '<strong>📱 SPIELER-MODUS</strong>';
        const content = document.getElementById('content');
        content.innerHTML = `
            <div class="card" id="join-card">
                <h2>🎮 Beitreten</h2>
                <input type="text" id="player-name" placeholder="Dein Name">
                <button id="join-btn">Beitreten</button>
            </div>
            <div class="card" id="quiz-card" style="display:none;">
                <div id="current-question" class="question"></div>
                <div id="answer-area"></div>
                <div id="ranking-area"></div>
            </div>
        `;

        document.getElementById('join-btn').onclick = async () => {
            const name = document.getElementById('player-name').value.trim();
            if (!name) return alert("Bitte Namen eingeben");
            const { data, error } = await supabase.from('quiz_players').insert({ session_id: currentSessionId, player_name: name }).select().single();
            if (error) return alert("Fehler: " + error.message);
            currentPlayerId = data.id;
            document.getElementById('join-card').style.display = 'none';
            document.getElementById('quiz-card').style.display = 'block';
            subscribeToQuestions();
            updateRanking();
        };

        async function subscribeToQuestions() {
            // Hole aktuelle Session (current_q_index)
            const { data: session } = await supabase.from('quiz_sessions').select('current_q_index').eq('id', currentSessionId).single();
            // Für Demo: erstmal keine dynamische Frage, nur Platzhalter
            document.getElementById('current-question').innerText = "Demo-Frage: Wie viele Einwohner hat Föhr? (Schätzung)";
            document.getElementById('answer-area').innerHTML = `<input type="text" id="answer-input" placeholder="Deine Antwort"><button onclick="sendAnswerDemo()">Absenden</button>`;
            window.sendAnswerDemo = async function() {
                const ans = document.getElementById('answer-input').value;
                if (!ans) return;
                alert("Demo: Antwort wurde nicht gespeichert, weil Fragenlogik noch im Aufbau.");
            };
        }

        async function updateRanking() {
            const { data } = await supabase.from('quiz_players').select('player_name, total_score').eq('session_id', currentSessionId).order('total_score', { ascending: false });
            const html = '<h3>🏆 Punktestand</h3>' + (data || []).map(p => `<div>${p.player_name}: ${p.total_score} Punkte</div>`).join('');
            document.getElementById('ranking-area').innerHTML = html;
        }
        setInterval(updateRanking, 3000);
    }

    // Start je nach View
    if (view === 'host') renderHost();
    else renderJoin();
</script>
</body>
</html>
