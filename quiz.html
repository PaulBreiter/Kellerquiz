<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎉 Live-Quiz Party!</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root { --bg: #fef9e8; --card-bg: #ffffff; --border: #2d3436; --shadow: #dfe6e9; --purple: #6c5ce7; --orange: #e67e22; --green: #2ecc71; --red: #e74c3c; --blue: #3498db; --pink: #fd79a8; --yellow: #fdcb6e; --text: #2d3436; --radius: 18px; --border-width: 3px; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Fredoka', 'Segoe UI', system-ui, sans-serif; background: var(--bg); background-image: radial-gradient(circle at 10% 20%, #ffeaa7 1px, transparent 1px), radial-gradient(circle at 90% 70%, #fab1a0 1px, transparent 1px), radial-gradient(circle at 30% 80%, #a29bfe 1px, transparent 1px), radial-gradient(circle at 70% 10%, #55efc4 1px, transparent 1px); background-size: 80px 80px, 100px 100px, 120px 120px, 90px 90px; color: var(--text); min-height: 100vh; padding: 16px; display: flex; align-items: center; justify-content: center; }
        .container { max-width: 900px; width: 100%; margin: 0 auto; }
        .card { background: var(--card-bg); border: var(--border-width) solid var(--border); border-radius: var(--radius); padding: 24px 20px; margin-bottom: 20px; box-shadow: 8px 8px 0 var(--shadow); transition: transform 0.15s ease, box-shadow 0.15s ease; }
        .card:hover { transform: translate(-2px, -2px); box-shadow: 10px 10px 0 var(--shadow); }
        .card:active { transform: translate(2px, 2px); box-shadow: 4px 4px 0 var(--shadow); }
        .card-header { font-size: 1.3rem; font-weight: 700; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
        .btn { display: inline-block; padding: 12px 22px; font-family: inherit; font-size: 1rem; font-weight: 600; border: 3px solid var(--border); border-radius: 40px; cursor: pointer; box-shadow: 4px 4px 0 var(--shadow); transition: all 0.1s ease; text-align: center; user-select: none; -webkit-tap-highlight-color: transparent; touch-action: manipulation; min-height: 48px; min-width: 48px; background: #fff; color: var(--text); }
        .btn:active { transform: translate(3px, 3px); box-shadow: 1px 1px 0 var(--shadow); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: 4px 4px 0 var(--shadow); }
        .btn-purple { background: var(--purple); color: #fff; }
        .btn-orange { background: var(--orange); color: #fff; }
        .btn-green { background: var(--green); color: #fff; }
        .btn-red { background: var(--red); color: #fff; }
        .btn-blue { background: var(--blue); color: #fff; }
        .btn-yellow { background: var(--yellow); color: var(--text); }
        .btn-pink { background: var(--pink); color: #fff; }
        .btn-outline { background: #fff; color: var(--text); }
        .btn-sm { padding: 8px 16px; font-size: 0.85rem; min-height: 40px; }
        .btn-lg { padding: 16px 30px; font-size: 1.2rem; min-height: 56px; }
        input[type="text"], input[type="number"], input[type="url"], textarea, select { width: 100%; padding: 12px 16px; font-family: inherit; font-size: 1rem; border: 3px solid var(--border); border-radius: 40px; box-shadow: 3px 3px 0 var(--shadow); outline: none; transition: box-shadow 0.15s; background: #fff; color: var(--text); }
        input:focus, textarea:focus, select:focus { box-shadow: 5px 5px 0 var(--purple); }
        textarea { border-radius: 18px; min-height: 80px; resize: vertical; }
        #qrcode-container { display: flex; justify-content: center; padding: 16px; background: #fff; border-radius: 16px; border: 2px dashed var(--border); }
        #qrcode-container canvas, #qrcode-container img { max-width: 180px; height: auto; }
        .player-grid { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; }
        .player-chip { background: var(--yellow); border: 3px solid var(--border); border-radius: 30px; padding: 8px 16px; font-weight: 600; box-shadow: 3px 3px 0 var(--shadow); display: flex; align-items: center; gap: 6px; }
        .player-chip .score { background: var(--purple); color: #fff; border-radius: 20px; padding: 2px 10px; font-size: 0.85rem; }
        .ranking-table { width: 100%; border-collapse: separate; border-spacing: 0; border: 3px solid var(--border); border-radius: 16px; overflow: hidden; box-shadow: 4px 4px 0 var(--shadow); }
        .ranking-table th, .ranking-table td { padding: 10px 14px; text-align: left; border-bottom: 2px solid #eee; }
        .ranking-table th { background: var(--purple); color: #fff; font-weight: 700; font-size: 0.9rem; }
        .ranking-table tr:nth-child(even) td { background: #fdf6ff; }
        .ranking-table tr:last-child td { border-bottom: none; }
        .rank-badge { display: inline-block; width: 30px; height: 30px; line-height: 30px; text-align: center; border-radius: 50%; font-weight: 700; font-size: 0.85rem; }
        .rank-1 { background: #ffd700; color: #000; }
        .rank-2 { background: #c0c0c0; color: #000; }
        .rank-3 { background: #cd7f32; color: #fff; }
        /* Timer ausgeblendet */
        .timer-display { display: none; }
        .option-btn { display: block; width: 100%; padding: 14px 18px; margin: 8px 0; font-family: inherit; font-size: 1rem; font-weight: 500; border: 3px solid var(--border); border-radius: 30px; cursor: pointer; background: #fff; box-shadow: 4px 4px 0 var(--shadow); text-align: left; transition: all 0.1s; touch-action: manipulation; }
        .option-btn:hover { background: #f0ecff; }
        .option-btn.selected { background: var(--purple); color: #fff; border-color: var(--purple); box-shadow: 4px 4px 0 #4a3db5; }
        .option-btn:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0 var(--shadow); }
        .answer-item { background: #f8f9fa; border: 2px solid var(--border); border-radius: 12px; padding: 8px 14px; margin: 6px 0; display: flex; justify-content: space-between; align-items: center; font-size: 0.9rem; }
        .answer-item.correct-glow { animation: glowGreen 0.6s ease-out; }
        @keyframes glowGreen { 0% { background: #2ecc71; color: #fff; } 100% { background: #f8f9fa; color: inherit; } }
        .hidden { display: none !important; }
        .spinner { display: inline-block; width: 28px; height: 28px; border: 4px solid var(--border); border-top: 4px solid var(--purple); border-radius: 50%; animation: spin 0.7s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        @media (max-width: 600px) { .card { padding: 16px 12px; } .btn { padding: 10px 16px; font-size: 0.9rem; min-height: 44px; } .player-chip { padding: 6px 12px; font-size: 0.85rem; } }
        .glow-green { animation: glowBg 0.8s ease-out; }
        @keyframes glowBg { 0% { background: #2ecc71; color: #fff; } 100% { background: #fff; color: inherit; } }
    </style>
</head>
<body>
    <div class="container" id="app-container"></div>

    <script>
        (async function() {
            const SUPABASE_URL = 'https://xvnhtfmedzjblinchzmt.supabase.co';
            const SUPABASE_KEY = 'sb_publishable_8wS4n-07wc2SCmniuTdYmA_uRIlNE4z';
            const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

            let currentView = null, currentSessionId = null, currentPlayerId = null, currentPlayerName = null;
            let currentQuestion = null, allQuestions = [], players = [], answersForCurrentQuestion = [];
            let answerSubmitted = false, selectedMcOption = null;
            let audioCtx = null;

            function initAudio() { if (!audioCtx) audioCtx = new(window.AudioContext || window.webkitAudioContext)(); }
            function playPling() { if (!audioCtx) return; try { const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain(); osc.connect(gain); gain.connect(audioCtx.destination); osc.type = 'sine'; osc.frequency.setValueAtTime(880, audioCtx.currentTime); osc.frequency.exponentialRampToValueAtTime(1760, audioCtx.currentTime + 0.08); gain.gain.setValueAtTime(0.3, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2); osc.start(audioCtx.currentTime); osc.stop(audioCtx.currentTime + 0.2); } catch(e) {} }

            function getUrlParams() { const p = new URLSearchParams(window.location.search); return { view: p.get('view'), session: p.get('session') }; }

            async function initApp() {
                const { view, session } = getUrlParams();
                currentView = view; currentSessionId = session ? parseInt(session) : null;
                const c = document.getElementById('app-container');
                if (view === 'host') { c.innerHTML = renderHostView(); await setupHost(); }
                else if (view === 'join' && currentSessionId) { c.innerHTML = renderPlayerJoinView(); await setupPlayerJoin(); }
                else { c.innerHTML = `<div class="card" style="text-align:center;"><h1>🎉 Live-Quiz Party!</h1><p style="font-size:1.1rem;margin:16px 0;">Scanne den QR-Code vom Host oder erstelle dein eigenes Quiz!</p><a href="?view=host" class="btn btn-purple btn-lg" style="text-decoration:none;display:inline-block;">🚀 Neues Quiz starten</a></div>`; }
            }

            function renderHostView() {
                return `
                <div class="card" id="host-setup-card"><div class="card-header"><span class="emoji">🎤</span> Quiz-Session erstellen</div><div id="host-session-creator"><input type="text" id="session-name-input" placeholder="Name der Session"/><button class="btn btn-purple btn-lg" id="btn-create-session" style="margin-top:12px;width:100%;">✨ Neue Session erstellen</button></div><div id="host-session-info" class="hidden"><p><strong>Session:</strong> <span id="host-session-name-display"></span> (ID: <span id="host-session-id-display"></span>)</p><div id="qrcode-container"></div><p style="text-align:center;font-size:0.85rem;word-break:break-all;margin-top:8px;">Link: <span id="host-join-link"></span></p><button class="btn btn-sm btn-outline" id="btn-copy-link" style="margin-top:6px;">📋 Link kopieren</button></div></div>
                <div class="card hidden" id="host-excel-card"><div class="card-header"><span class="emoji">📂</span> Fragen hochladen (Excel)</div><input type="file" id="excel-file-input" accept=".xlsx,.xls,.csv"/><button class="btn btn-orange btn-sm" id="btn-upload-excel" style="margin-top:8px;" disabled>📤 Hochladen & Speichern</button><span id="excel-status" style="margin-left:10px;font-size:0.9rem;"></span><div id="excel-preview" style="margin-top:10px;font-size:0.85rem;"></div></div>
                <div class="card hidden" id="host-question-card">
                  <div class="card-header"><span class="emoji">❓</span> Aktuelle Frage</div>
                  <div id="host-question-display"><h2 id="host-question-text"></h2><img id="host-question-image" src="" alt="Frage-Bild" style="max-width:100%;max-height:300px;border-radius:12px;display:none;"/><p style="font-size:0.85rem;color:#666;">Typ: <span id="host-question-type"></span></p></div>
                  <div style="display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin:12px 0;">
                    <button class="btn btn-green btn-lg" id="btn-start-question" style="display:none;">▶️ Frage starten</button>
                    <button class="btn btn-orange btn-lg hidden" id="btn-evaluate">📊 Auswerten</button>
                    <button class="btn btn-red btn-lg hidden" id="btn-next-question">⏭️ Nächste Frage</button>
                    <button class="btn btn-yellow btn-sm hidden" id="btn-manual-score">✏️ Punkte manuell anpassen</button>
                  </div>
                  <div id="host-answers-list" style="margin-top:10px;"><p style="font-weight:600;">Eingegangene Antworten:</p><div id="host-answers-container"></div></div>
                  <div id="host-manual-score-area" class="hidden" style="margin-top:10px;padding:12px;border:2px dashed var(--border);border-radius:12px;">
                    <p style="font-weight:600;">Manuelle Punkteanpassung:</p><select id="manual-player-select" style="margin-bottom:8px;"></select>
                    <input type="number" id="manual-score-input" placeholder="Neue Punktzahl" step="0.001" style="margin-bottom:8px;"/>
                    <button class="btn btn-sm btn-yellow" id="btn-apply-manual-score">✅ Anwenden</button>
                  </div>
                  <hr style="margin:16px 0;border:2px dashed var(--border);">
                  <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
                    <span style="font-weight:700;">👥 Spieler (<span id="host-player-count">0</span>):</span>
                    <div class="player-grid" id="host-player-list"></div>
                  </div>
                </div>
                <div class="card hidden" id="host-final-card"><div class="card-header"><span class="emoji">🏆</span> Endwertung</div><div id="host-final-ranking"></div><button class="btn btn-purple btn-lg" id="btn-new-game" style="margin-top:12px;">🔄 Neues Quiz</button></div>`;
            }

            async function setupHost() {
                const btnCreate = document.getElementById('btn-create-session');
                const sessionNameInput = document.getElementById('session-name-input');
                const btnUploadExcel = document.getElementById('btn-upload-excel');
                const excelFileInput = document.getElementById('excel-file-input');
                const btnCopyLink = document.getElementById('btn-copy-link');
                btnCreate.addEventListener('click', async () => {
                    const name = sessionNameInput.value.trim();
                    if (!name) { alert('Bitte einen Session-Namen eingeben!'); return; }
                    btnCreate.disabled = true; btnCreate.textContent = '⏳ Erstelle...';
                    try {
                        const { data, error } = await supabase.from('quiz_sessions').insert({ name: name, active: true, current_question_index: 0 }).select().single();
                        if (error) throw error;
                        currentSessionId = data.id;
                        document.getElementById('host-session-creator').classList.add('hidden');
                        document.getElementById('host-session-info').classList.remove('hidden');
                        document.getElementById('host-session-name-display').textContent = data.name;
                        document.getElementById('host-session-id-display').textContent = data.id;
                        const joinUrl = `${window.location.origin}${window.location.pathname}?view=join&session=${data.id}`;
                        document.getElementById('host-join-link').textContent = joinUrl;
                        const qrContainer = document.getElementById('qrcode-container');
                        qrContainer.innerHTML = '';
                        new QRCode(qrContainer, { text: joinUrl, width: 180, height: 180, colorDark: '#2d3436', colorLight: '#ffffff' });
                        document.getElementById('host-excel-card').classList.remove('hidden');
                        btnUploadExcel.disabled = false;
                        subscribeHostRealtime(data.id);
                        window.history.replaceState({}, '', `?view=host&session=${data.id}`);
                    } catch(err) { alert('Fehler beim Erstellen der Session: ' + err.message); console.error(err); }
                    btnCreate.disabled = false; btnCreate.textContent = '✨ Neue Session erstellen';
                });
                excelFileInput.addEventListener('change', () => { btnUploadExcel.disabled = !excelFileInput.files.length; });
                btnUploadExcel.addEventListener('click', async () => { await handleExcelUpload(); });
                btnCopyLink?.addEventListener('click', () => {
                    const link = document.getElementById('host-join-link').textContent;
                    navigator.clipboard.writeText(link).then(() => alert('Link kopiert! 📋')).catch(() => prompt('Link manuell kopieren:', link));
                });
                if (currentSessionId) {
                    const { data: existingSession } = await supabase.from('quiz_sessions').select('*').eq('id', currentSessionId).single();
                    if (existingSession) {
                        document.getElementById('host-session-creator').classList.add('hidden');
                        document.getElementById('host-session-info').classList.remove('hidden');
                        document.getElementById('host-session-name-display').textContent = existingSession.name;
                        document.getElementById('host-session-id-display').textContent = existingSession.id;
                        const joinUrl = `${window.location.origin}${window.location.pathname}?view=join&session=${existingSession.id}`;
                        document.getElementById('host-join-link').textContent = joinUrl;
                        const qrContainer = document.getElementById('qrcode-container');
                        qrContainer.innerHTML = '';
                        new QRCode(qrContainer, { text: joinUrl, width: 180, height: 180, colorDark: '#2d3436', colorLight: '#ffffff' });
                        document.getElementById('host-excel-card').classList.remove('hidden');
                        btnUploadExcel.disabled = false;
                        subscribeHostRealtime(existingSession.id);
                        await loadHostState(existingSession);
                    }
                }
            }

            async function loadHostState(session) {
                currentSessionId = session.id;
                const { data: questions } = await supabase.from('quiz_questions').select('*').eq('session_id', session.id).order('order_index', { ascending: true });
                allQuestions = questions || [];
                const { data: pls } = await supabase.from('quiz_players').select('*').eq('session_id', session.id);
                players = pls || [];
                updateHostPlayerList();
                if (allQuestions.length > 0) {
                    document.getElementById('host-setup-card').classList.add('hidden');
                    document.getElementById('host-excel-card').classList.add('hidden');
                }
                if (session.current_question_index >= 0 && allQuestions.length > 0) {
                    const qIndex = Math.min(session.current_question_index, allQuestions.length - 1);
                    currentQuestion = allQuestions[qIndex];
                    document.getElementById('host-question-card').classList.remove('hidden');
                    displayHostQuestion(currentQuestion);
                    await loadAnswersForCurrentQuestion();
                    updateHostButtons();
                }
                if (session.current_question_index >= allQuestions.length && allQuestions.length > 0) showFinalRanking();
            }

            function updateHostButtons() {
                const btnStart = document.getElementById('btn-start-question');
                const btnEval = document.getElementById('btn-evaluate');
                const btnNext = document.getElementById('btn-next-question');
                const btnManual = document.getElementById('btn-manual-score');
                btnStart.style.display = 'none'; btnEval.classList.add('hidden'); btnNext.classList.add('hidden'); btnManual.classList.add('hidden');
                if (!currentQuestion) { btnStart.style.display = 'inline-block'; return; }
                if (answersForCurrentQuestion.length === 0 && !answerSubmitted) btnStart.style.display = 'inline-block';
                if (answersForCurrentQuestion.length > 0) { btnEval.classList.remove('hidden'); btnManual.classList.remove('hidden'); }
                const hasScores = answersForCurrentQuestion.some(a => a.score_awarded !== null && a.score_awarded !== undefined);
                if (hasScores) {
                    btnNext.classList.remove('hidden'); btnEval.classList.add('hidden'); btnStart.style.display = 'none';
                }
            }

            function subscribeHostRealtime(sessionId) {
                supabase.channel('host-players-' + sessionId).on('postgres_changes', { event: '*', schema: 'public', table: 'quiz_players', filter: `session_id=eq.${sessionId}` }, async () => {
                    const { data } = await supabase.from('quiz_players').select('*').eq('session_id', sessionId);
                    players = data || []; updateHostPlayerList(); playPling();
                }).subscribe();
                supabase.channel('host-answers-' + sessionId).on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'quiz_answers', filter: currentQuestion ? `question_id=eq.${currentQuestion.id}` : undefined }, async (payload) => {
                    if (currentQuestion && payload.new.question_id === currentQuestion.id) { await loadAnswersForCurrentQuestion(); playPling(); }
                }).subscribe();
            }

            async function loadAnswersForCurrentQuestion() {
                if (!currentQuestion) return;
                const { data } = await supabase.from('quiz_answers').select('*, quiz_players!inner(player_name)').eq('question_id', currentQuestion.id);
                answersForCurrentQuestion = data || []; renderHostAnswers(); updateHostButtons();
            }

            function renderHostAnswers() {
                const container = document.getElementById('host-answers-container');
                if (!container) return;
                if (answersForCurrentQuestion.length === 0) { container.innerHTML = '<p style="color:#999;">Noch keine Antworten...</p>'; return; }
                container.innerHTML = answersForCurrentQuestion.map(a => `<div class="answer-item" id="answer-row-${a.id}"><span><strong>${a.quiz_players?.player_name || 'Unbekannt'}:</strong> ${a.answer_text || '---'}</span><span style="font-weight:700;">${a.score_awarded != null ? '⭐' + a.score_awarded.toFixed(3) : '⏳'}</span></div>`).join('');
            }

            function updateHostPlayerList() {
                const container = document.getElementById('host-player-list');
                const countEl = document.getElementById('host-player-count');
                if (!container) return;
                if (countEl) countEl.textContent = players.length;
                container.innerHTML = players.map(p => `<div class="player-chip">${p.player_name}<span class="score">${p.total_score?.toFixed(1) || '0'}</span></div>`).join('');
            }

            async function handleExcelUpload() {
                const fileInput = document.getElementById('excel-file-input');
                const statusEl = document.getElementById('excel-status');
                const previewEl = document.getElementById('excel-preview');
                const file = fileInput.files[0];
                if (!file || !currentSessionId) return;
                statusEl.textContent = '⏳ Lese Datei...';
                try {
                    const data = await readExcelFile(file);
                    statusEl.textContent = `✅ ${data.length} Fragen erkannt. Speichere...`;
                    previewEl.textContent = data.slice(0, 3).map((r, i) => `${i+1}. ${r.Frage}`).join(' | ') + ' ...';
                    const requiredCols = ['Frage', 'Typ', 'Antwort'];
                    for (const row of data) for (const col of requiredCols) if (!row[col]) throw new Error(`Spalte "${col}" fehlt in einer Zeile!`);
                    await supabase.from('quiz_questions').delete().eq('session_id', currentSessionId);
                    const questionsToInsert = data.map((row, index) => ({
                        session_id: currentSessionId,
                        text: row['Frage']?.toString().trim() || '',
                        type: row['Typ']?.toString().trim() || 'Freitext',
                        correct_answer: row['Antwort']?.toString().trim() || '',
                        options: row['Optionen']?.toString().trim() || null,
                        image_url: row['Bild-URL']?.toString().trim() || null,
                        time_limit: parseInt(row['Zeit (Sek.)']) || 0,
                        scoring_rule: row['Punktregel']?.toString().trim() || '{"exakt":1}',
                        strict_order: (row['Reihenfolge wichtig']?.toString().trim().toLowerCase() === 'ja'),
                        order_index: index
                    }));
                    const { error } = await supabase.from('quiz_questions').insert(questionsToInsert);
                    if (error) throw error;
                    statusEl.textContent = `✅ ${data.length} Fragen gespeichert!`;
                    const { data: fresh } = await supabase.from('quiz_questions').select('*').eq('session_id', currentSessionId).order('order_index', { ascending: true });
                    allQuestions = fresh || [];
                    if (allQuestions.length > 0) {
                        document.getElementById('host-setup-card').classList.add('hidden');
                        document.getElementById('host-excel-card').classList.add('hidden');
                        document.getElementById('host-question-card').classList.remove('hidden');
                        document.getElementById('btn-start-question').style.display = 'inline-block';
                        currentQuestion = null;
                    }
                } catch(err) { statusEl.textContent = '❌ Fehler: ' + err.message; console.error(err); }
            }

            function readExcelFile(file) {
                return new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.onload = (e) => { try { const wb = XLSX.read(e.target.result, { type: 'array' }); const json = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval: '' }); resolve(json); } catch(err) { reject(new Error('Excel-Datei konnte nicht gelesen werden.')); } };
                    reader.onerror = () => reject(new Error('Fehler beim Lesen der Datei.'));
                    reader.readAsArrayBuffer(file);
                });
            }

            document.addEventListener('click', async (e) => {
                if (currentView !== 'host') return;
                initAudio();
                if (e.target.id === 'btn-start-question') await startQuestion();
                if (e.target.id === 'btn-evaluate') await evaluateAnswers();
                if (e.target.id === 'btn-next-question') await nextQuestion();
                if (e.target.id === 'btn-manual-score') toggleManualScore();
                if (e.target.id === 'btn-apply-manual-score') await applyManualScore();
                if (e.target.id === 'btn-new-game') window.location.href = '?view=host';
            });

            async function startQuestion() {
                if (!currentSessionId || allQuestions.length === 0) return;
                const { data: session } = await supabase.from('quiz_sessions').select('current_question_index').eq('id', currentSessionId).single();
                const qIndex = session?.current_question_index || 0;
                if (qIndex >= allQuestions.length) { showFinalRanking(); return; }
                currentQuestion = allQuestions[qIndex];
                answerSubmitted = false; selectedMcOption = null; answersForCurrentQuestion = [];
                document.getElementById('host-question-card').classList.remove('hidden');
                displayHostQuestion(currentQuestion);
                document.getElementById('btn-start-question').style.display = 'none';
                document.getElementById('btn-evaluate').classList.add('hidden');
                document.getElementById('btn-next-question').classList.add('hidden');
                document.getElementById('btn-manual-score').classList.add('hidden');
                document.getElementById('host-answers-container').innerHTML = '<p style="color:#999;">Warte auf Antworten...</p>';
            }

            function displayHostQuestion(q) {
                document.getElementById('host-question-text').textContent = q.text;
                document.getElementById('host-question-type').textContent = q.type;
                const imgEl = document.getElementById('host-question-image');
                if (q.image_url && q.image_url.trim() !== '') {
                    imgEl.src = q.image_url;
                    imgEl.style.display = 'block';
                } else {
                    imgEl.style.display = 'none';
                }
            }

            async function evaluateAnswers() {
                if (!currentQuestion || !currentSessionId) return;
                const btnEval = document.getElementById('btn-evaluate'); btnEval.disabled = true; btnEval.textContent = '⏳ Werte aus...';
                await loadAnswersForCurrentQuestion();
                const scoringRule = parseScoringRule(currentQuestion.scoring_rule);
                const correctAnswer = currentQuestion.correct_answer?.trim() || '';
                const qType = currentQuestion.type;
                const updates = [];
                for (const answer of answersForCurrentQuestion) {
                    let score = 0; let isCorrect = false;
                    const playerAnswer = (answer.answer_text || '').trim();
                    if (qType === 'Schätzung') { score = null; }
                    else if (qType === 'Aufzählung') { score = evaluateAufzaehlung(playerAnswer, correctAnswer, currentQuestion.strict_order, scoringRule); isCorrect = score > 0; }
                    else { const nP = playerAnswer.toLowerCase().replace(/\s+/g, ''); const nC = correctAnswer.toLowerCase().replace(/\s+/g, ''); if (nP === nC) { score = scoringRule.exakt || 1; isCorrect = true; } else { score = 0; isCorrect = false; } }
                    updates.push({ answer, score, isCorrect });
                }
                if (qType === 'Schätzung') {
                    const correctNum = parseFloat(correctAnswer.replace(',', '.'));
                    const diffs = updates.map(u => ({ ...u, diff: Math.abs(parseFloat((u.answer.answer_text || '0').replace(',', '.')) - correctNum) }));
                    diffs.sort((a, b) => a.diff - b.diff);
                    let currentRank = 0, lastDiff = -1;
                    for (const item of diffs) { if (item.diff !== lastDiff) currentRank++; item.rank = currentRank; lastDiff = item.diff; }
                    for (const item of diffs) { const pts = scoringRule[String(item.rank)] || 0; item.score = pts; item.isCorrect = pts > 0; }
                    for (const item of diffs) { const orig = updates.find(u => u.answer.id === item.answer.id); if (orig) { orig.score = item.score; orig.isCorrect = item.isCorrect; } }
                }
                for (const u of updates) {
                    if (u.score === null) u.score = 0;
                    await supabase.from('quiz_answers').update({ score_awarded: u.score, is_correct: u.isCorrect }).eq('id', u.answer.id);
                    const { data: allPlayerAnswers } = await supabase.from('quiz_answers').select('score_awarded').eq('player_id', u.answer.player_id);
                    const totalScore = (allPlayerAnswers || []).reduce((sum, a) => sum + (a.score_awarded || 0), 0);
                    await supabase.from('quiz_players').update({ total_score: totalScore }).eq('id', u.answer.player_id);
                }
                const { data: freshPlayers } = await supabase.from('quiz_players').select('*').eq('session_id', currentSessionId);
                players = freshPlayers || []; updateHostPlayerList(); await loadAnswersForCurrentQuestion(); renderHostAnswers();
                updates.filter(u => u.isCorrect).forEach(u => { const row = document.getElementById('answer-row-' + u.answer.id); if (row) row.classList.add('correct-glow'); });
                btnEval.disabled = false; btnEval.textContent = '📊 Auswerten'; btnEval.classList.add('hidden');
                document.getElementById('btn-next-question').classList.remove('hidden');
            }

            function evaluateAufzaehlung(playerAnswer, correctAnswer, strictOrder, scoringRule) {
                const playerItems = playerAnswer.split(';').map(s => s.trim().toLowerCase()).filter(Boolean);
                const correctItems = correctAnswer.split(';').map(s => s.trim().toLowerCase()).filter(Boolean);
                const proPosition = scoringRule.proPosition || (1 / correctItems.length);
                if (strictOrder) { let c = 0; for (let i=0; i<Math.min(playerItems.length, correctItems.length); i++) if (playerItems[i]===correctItems[i]) c++; return c * proPosition; }
                else { const uP = [...new Set(playerItems)]; const uC = [...new Set(correctItems)]; let c = 0; for (const item of uP) if (uC.includes(item)) c++; return c * proPosition; }
            }

            function parseScoringRule(ruleStr) { try { return JSON.parse(ruleStr); } catch { return { exakt: 1 }; } }

            async function nextQuestion() {
                if (!currentSessionId) return;
                const { data: session } = await supabase.from('quiz_sessions').select('current_question_index').eq('id', currentSessionId).single();
                const newIndex = (session?.current_question_index || 0) + 1;
                if (newIndex >= allQuestions.length) { await supabase.from('quiz_sessions').update({ current_question_index: newIndex }).eq('id', currentSessionId); showFinalRanking(); return; }
                await supabase.from('quiz_sessions').update({ current_question_index: newIndex }).eq('id', currentSessionId);
                currentQuestion = allQuestions[newIndex]; answerSubmitted = false; selectedMcOption = null; answersForCurrentQuestion = [];
                document.getElementById('host-question-card').classList.remove('hidden');
                displayHostQuestion(currentQuestion);
                document.getElementById('btn-start-question').style.display = 'none'; document.getElementById('btn-evaluate').classList.add('hidden'); document.getElementById('btn-next-question').classList.add('hidden'); document.getElementById('btn-manual-score').classList.add('hidden');
                document.getElementById('host-answers-container').innerHTML = '<p style="color:#999;">Warte auf Antworten...</p>';
            }

            function showFinalRanking() {
                document.getElementById('host-setup-card').classList.add('hidden');
                document.getElementById('host-excel-card').classList.add('hidden');
                document.getElementById('host-question-card').classList.add('hidden');
                const finalCard = document.getElementById('host-final-card'); finalCard.classList.remove('hidden');
                const sorted = [...players].sort((a, b) => (b.total_score || 0) - (a.total_score || 0));
                const rankingHtml = sorted.map((p, i) => {
                    let bc = ''; if (i===0) bc='rank-1'; else if (i===1) bc='rank-2'; else if (i===2) bc='rank-3';
                    return `<tr><td><span class="rank-badge ${bc}">${i+1}</span></td><td>${p.player_name}</td><td><strong>${(p.total_score||0).toFixed(3)}</strong></td></tr>`;
                }).join('');
                document.getElementById('host-final-ranking').innerHTML = `<table class="ranking-table"><thead><tr><th>#</th><th>Spieler</th><th>Punkte</th></tr></thead><tbody>${rankingHtml}</tbody></table>`;
            }

            async function applyManualScore() { /* unverändert */ }

            function renderPlayerJoinView() {
                return `
                <div class="card" id="player-join-card"><div class="card-header"><span class="emoji">🎮</span> Quiz beitreten</div><p>Session-ID: <strong>${currentSessionId}</strong></p><input type="text" id="player-name-input" placeholder="Dein Name"/><button class="btn btn-green btn-lg" id="btn-join-session" style="margin-top:12px;width:100%;">🚀 Beitreten</button><div id="player-join-error" style="color:var(--red);margin-top:8px;font-weight:600;"></div></div>
                <div class="card hidden" id="player-game-card"><div class="card-header"><span class="emoji">❓</span> Frage</div><div id="player-question-display"><h2 id="player-question-text"></h2><img id="player-question-image" src="" alt="Bild" style="max-width:100%;max-height:250px;border-radius:12px;display:none;"/><p style="font-size:0.85rem;color:#666;">Typ: <span id="player-question-type"></span></p></div><div id="player-answer-area"></div><button class="btn btn-purple btn-lg" id="btn-submit-answer" style="width:100%;margin-top:12px;">📨 Antwort absenden</button><div id="player-answer-confirmation" class="hidden" style="text-align:center;color:var(--green);font-weight:700;margin-top:8px;">✅ Antwort gespeichert!</div></div>
                <div class="card hidden" id="player-ranking-card"><div class="card-header"><span class="emoji">🏆</span> Ranking</div><div id="player-ranking-table"></div><p style="text-align:center;margin-top:8px;font-weight:700;">Deine Punkte: <span id="player-own-score">0</span></p></div>
                <div class="card hidden" id="player-waiting-card"><p style="text-align:center;">⏳ Warte auf die nächste Frage...</p><div style="text-align:center;"><span class="spinner"></span></div></div>`;
            }

            function subscribePlayerRealtime(session) { /* unverändert */ }
            async function loadPlayerCurrentQuestion(session) { /* unverändert */ }
            function renderPlayerAnswerArea(question) { /* unverändert */ }
            async function submitPlayerAnswer() { /* unverändert */ }
            async function updatePlayerRanking() { /* unverändert */ }
            function escapeHtml(str) { const div = document.createElement('div'); div.textContent = str; return div.innerHTML; }

            // Start
            document.addEventListener('DOMContentLoaded', initApp);
            window.addEventListener('beforeunload', () => {});
            console.log('🎉 Live-Quiz Party! – Script geladen.');
        })();
    </script>
