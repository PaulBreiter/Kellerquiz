<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KELLERQUIZ – Host (Comic)</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; }
        body {
            font-family: 'Fredoka', 'Segoe UI', system-ui;
            background: #f0f4f8;
            padding: 20px;
            color: #2d3436;
        }
        .container { max-width: 1400px; margin: 0 auto; }
        .card {
            background: white;
            border-radius: 32px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            border: 3px solid #2d3436;
            box-shadow: 8px 8px 0 #dfe6e9;
        }
        button, .btn {
            background: #6c5ce7;
            border: 3px solid #2d3436;
            border-radius: 60px;
            padding: 10px 24px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            box-shadow: 4px 4px 0 #2d3436;
            transition: 0.1s;
        }
        button:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 #2d3436; }
        input, select {
            border: 2px solid #2d3436;
            border-radius: 60px;
            padding: 10px 16px;
            width: 100%;
            background: #fef9e8;
        }
        .flex-between { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; }
        .players-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }
        .player-card {
            background: #fef9e8;
            border-radius: 24px;
            padding: 12px;
            text-align: center;
            border: 2px solid #2d3436;
        }
        .answer-list { max-height: 300px; overflow-y: auto; margin: 15px 0; }
        .answer-item {
            background: #f0f2f5;
            margin: 5px 0;
            padding: 8px;
            border-radius: 20px;
            border-left: 8px solid #fdcb6e;
        }
        .error-message {
            background: #ffdddd;
            border-left: 8px solid #d63031;
            padding: 12px;
            border-radius: 20px;
            margin-bottom: 15px;
        }
        .qr { background: white; padding: 10px; border-radius: 20px; display: inline-block; }
        @media (max-width: 700px) { .players-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
<div class="container">
    <div class="flex-between">
        <h1>🎤 KELLERQUIZ – HOST</h1>
        <div id="session-info"></div>
    </div>

    <div class="card" id="setup-panel">
        <h2>1. Session starten</h2>
        <div class="flex-between">
            <input type="text" id="session-name" placeholder="Quiz-Name (z. B. 'Kellerquiz 2026')" style="width: 60%;">
            <button id="create-session">✨ Neue Session erstellen</button>
        </div>
        <div id="qr-container" style="margin-top: 20px; text-align: center;"></div>
        <div id="error-msg" class="error-message" style="display: none;"></div>
    </div>

    <div class="card" id="upload-panel" style="display: none;">
        <h2>2. Fragen importieren</h2>
        <input type="file" id="excel-file" accept=".xlsx, .xls, .csv">
        <button id="upload-excel">📂 Hochladen & speichern</button>
        <div id="upload-status"></div>
    </div>

    <div class="card" id="players-panel" style="display: none;">
        <div class="flex-between">
            <h2>👥 Spieler (<span id="player-count">0</span>)</h2>
            <button id="next-question-btn" style="background: #00b894;">➡️ Nächste Frage</button>
        </div>
        <div class="players-grid" id="players-list"></div>
    </div>

    <div class="card" id="question-panel" style="display: none;">
        <h2 id="question-text">Frage wird geladen...</h2>
        <div id="question-image" style="text-align: center; margin: 10px;"></div>
        <div id="question-options"></div>
        <div class="flex-between">
            <span>⏱️ <span id="timer-display">--</span> Sekunden</span>
            <button id="evaluate-btn" style="background: #fdcb6e; color:#2d3436;">📊 Auswerten & Punkte</button>
        </div>
        <div id="answers-list" class="answer-list"></div>
        <button id="manual-adjust" style="background: #e84393;">✏️ Punkte manuell anpassen</button>
    </div>
</div>

<script>
    // ==================== Supabase ====================
    const SUPABASE_URL = 'https://xvnhtfmedzjblinchzmt.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_8wS4n-07wc2SCmniuTdYmA_uRIlNE4z';
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let currentSessionId = null;
    let currentQuestions = [];
    let currentQuestionIndex = 0;
    let currentQuestionObj = null;
    let currentAnswers = [];

    function showError(msg) {
        const errDiv = document.getElementById('error-msg');
        errDiv.innerText = msg;
        errDiv.style.display = 'block';
        setTimeout(() => errDiv.style.display = 'none', 5000);
    }

    // Session erstellen
    document.getElementById('create-session').onclick = async () => {
        const name = document.getElementById('session-name').value.trim() || "Comic-Quiz";
        try {
            const { data, error } = await supabase
                .from('quiz_sessions')
                .insert({ session_name: name, is_active: true, current_question_index: 0 })
                .select()
                .single();
            if (error) throw error;
            currentSessionId = data.id;
            localStorage.setItem('livequiz_session', currentSessionId);
            const base = window.location.href.substring(0, window.location.href.lastIndexOf('/') + 1);
            const joinUrl = `${base}join.html?session=${currentSessionId}`;
            document.getElementById('qr-container').innerHTML = `<div class="qr" id="qrcode"></div><p>📲 Scannen zum Beitreten</p><a href="${joinUrl}" target="_blank">Direktlink</a>`;
            new QRCode(document.getElementById("qrcode"), { text: joinUrl, width: 160, height: 160 });
            document.getElementById('session-info').innerHTML = `<strong>Session:</strong> ${currentSessionId} – ${name}`;
            document.getElementById('setup-panel').style.display = 'none';
            document.getElementById('upload-panel').style.display = 'block';
            loadPlayers();
            subscribePlayers();
        } catch (err) {
            showError("Fehler: " + err.message);
        }
    };

    // Excel Upload
    document.getElementById('upload-excel').onclick = async () => {
        const file = document.getElementById('excel-file').files[0];
        if (!file) return showError("Bitte Datei auswählen");
        const reader = new FileReader();
        reader.onload = async (e) => {
            const data = new Uint8Array(e.target.result);
            const wb = XLSX.read(data, { type: 'array' });
            const sheet = wb.Sheets[wb.SheetNames[0]];
            const rows = XLSX.utils.sheet_to_json(sheet);
            if (rows.length === 0) return showError("Keine Zeilen in Excel");
            for (let i = 0; i < rows.length; i++) {
                const r = rows[i];
                const q = {
                    session_id: currentSessionId,
                    question_text: r.Frage,
                    question_type: r.Typ,
                    correct_answer: String(r.Antwort),
                    options: r.Optionen || null,
                    image_url: r['Bild-URL'] || null,
                    time_limit: Number(r['Zeit (Sek.)']) || 30,
                    scoring_rule: r.Punktregel || (r.Typ === 'Schätzung' ? '{"1":1,"2":0.5}' : '{"exakt":1}'),
                    order_index: i,
                    strict_order: r['Reihenfolge wichtig'] === 'Ja'
                };
                await supabase.from('quiz_questions').upsert(q);
            }
            document.getElementById('upload-status').innerHTML = `✅ ${rows.length} Fragen geladen!`;
            const { data: qs } = await supabase.from('quiz_questions').select('*').eq('session_id', currentSessionId).order('order_index');
            currentQuestions = qs;
            currentQuestionIndex = 0;
            document.getElementById('upload-panel').style.display = 'none';
            document.getElementById('players-panel').style.display = 'block';
            document.getElementById('question-panel').style.display = 'block';
            loadCurrentQuestion();
        };
        reader.readAsArrayBuffer(file);
    };

    async function loadCurrentQuestion() {
        if (currentQuestionIndex >= currentQuestions.length) {
            alert("🎉 Quiz beendet! Endauswertung folgt.");
            return;
        }
        currentQuestionObj = currentQuestions[currentQuestionIndex];
        document.getElementById('question-text').innerText = currentQuestionObj.question_text;
        if (currentQuestionObj.image_url) {
            document.getElementById('question-image').innerHTML = `<img src="${currentQuestionObj.image_url}" style="max-width:100%; max-height:250px; border-radius:20px;">`;
        } else {
            document.getElementById('question-image').innerHTML = '';
        }
        document.getElementById('timer-display').innerText = currentQuestionObj.time_limit;
        let seconds = currentQuestionObj.time_limit;
        const timer = setInterval(() => {
            seconds--;
            document.getElementById('timer-display').innerText = seconds;
            if (seconds <= 0) clearInterval(timer);
        }, 1000);
        loadAnswersForCurrent();
    }

    async function loadAnswersForCurrent() {
        const qid = currentQuestionObj.id;
        const { data } = await supabase.from('quiz_answers').select('*, players(player_name)').eq('question_id', qid);
        if (data) {
            currentAnswers = data;
            renderAnswers(data);
        }
        supabase.channel(`answers-${qid}`).on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'quiz_answers', filter: `question_id=eq.${qid}` }, () => {
            loadAnswersForCurrent();
        }).subscribe();
    }

    function renderAnswers(answers) {
        const container = document.getElementById('answers-list');
        container.innerHTML = answers.map(a => `<div class="answer-item">${a.players.player_name}: ${a.answer_text}</div>`).join('');
    }

    document.getElementById('evaluate-btn').onclick = async () => {
        const q = currentQuestionObj;
        const answers = currentAnswers;
        if (q.question_type === 'Schätzung') {
            const correctNum = parseFloat(q.correct_answer);
            const withDiff = answers.map(a => ({ ...a, diff: Math.abs(parseFloat(a.answer_text) - correctNum) }));
            withDiff.sort((a,b) => a.diff - b.diff);
            const first = withDiff[0]?.diff;
            const second = withDiff[1]?.diff;
            for (let a of withDiff) {
                let points = 0;
                if (a.diff === first) points = 1;
                else if (a.diff === second) points = 0.5;
                await supabase.from('quiz_answers').update({ score_awarded: points, is_correct: points>0 }).eq('id', a.id);
            }
        } else if (q.question_type === 'Aufzählung') {
            const correctList = q.correct_answer.split(';').map(s => s.trim().toLowerCase());
            const strict = q.strict_order;
            for (let ans of answers) {
                let points = 0;
                const userList = ans.answer_text.split(';').map(s => s.trim().toLowerCase());
                if (strict) {
                    let correctPos = 0;
                    for (let i=0; i<Math.min(correctList.length, userList.length); i++)
                        if (correctList[i] === userList[i]) correctPos++;
                    points = correctPos / correctList.length;
                } else {
                    const set = new Set(correctList);
                    const correctCount = userList.filter(item => set.has(item)).length;
                    points = correctCount / correctList.length;
                }
                await supabase.from('quiz_answers').update({ score_awarded: points, is_correct: points>0 }).eq('id', ans.id);
            }
        } else {
            for (let ans of answers) {
                const isCorrect = ans.answer_text.trim().toLowerCase() === q.correct_answer.trim().toLowerCase();
                const points = isCorrect ? 1 : 0;
                await supabase.from('quiz_answers').update({ score_awarded: points, is_correct }).eq('id', ans.id);
            }
        }
        const { data: players } = await supabase.from('quiz_players').select('id').eq('session_id', currentSessionId);
        for (let p of players) {
            const { data: scores } = await supabase.from('quiz_answers').select('score_awarded').eq('player_id', p.id);
            const total = scores.reduce((s, x) => s + (x.score_awarded || 0), 0);
            await supabase.from('quiz_players').update({ total_score: total }).eq('id', p.id);
        }
        alert("Auswertung fertig!");
        currentQuestionIndex++;
        if (currentQuestionIndex < currentQuestions.length) loadCurrentQuestion();
        else alert("Quiz beendet! 🎉");
    };

    async function loadPlayers() {
        const { data } = await supabase.from('quiz_players').select('*').eq('session_id', currentSessionId);
        renderPlayers(data);
    }
    function renderPlayers(players) {
        const container = document.getElementById('players-list');
        container.innerHTML = players.map(p => `<div class="player-card"><div class="player-name">🎮 ${p.player_name}</div><div class="player-score">⭐ ${p.total_score || 0} Punkte</div></div>`).join('');
        document.getElementById('player-count').innerText = players.length;
    }
    function subscribePlayers() {
        supabase.channel('players').on('postgres_changes', { event: '*', schema: 'public', table: 'quiz_players', filter: `session_id=eq.${currentSessionId}` }, () => {
            loadPlayers();
        }).subscribe();
    }

    document.getElementById('manual-adjust').onclick = () => {
        alert("Manuelle Punkteanpassung: Öffne den Table Editor in Supabase.");
    };

    window.onload = () => {
        const saved = localStorage.getItem('livequiz_session');
        if (saved) {
            currentSessionId = saved;
            document.getElementById('session-info').innerHTML = `Aktive Session: ${saved}`;
            document.getElementById('setup-panel').style.display = 'none';
            document.getElementById('upload-panel').style.display = 'block';
            loadPlayers();
            subscribePlayers();
        }
    };
</script>
</body>
</html>
