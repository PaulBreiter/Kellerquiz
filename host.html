<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>LIVE QUIZ HOST</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', 'Fredoka', system-ui;
            background: linear-gradient(145deg, #2c3e50, #1a2632);
            margin: 0;
            padding: 20px;
            color: #ecf0f1;
        }
        .container { max-width: 1400px; margin: 0 auto; }
        .flex-between { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; }
        .card {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border-radius: 32px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid rgba(255,255,255,0.2);
        }
        button, .btn {
            background: #e67e22;
            border: none;
            border-radius: 40px;
            padding: 12px 24px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            color: white;
        }
        button:hover { transform: translateY(-2px); background: #d35400; }
        input, select, textarea {
            background: rgba(255,255,255,0.2);
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 40px;
            padding: 10px 16px;
            color: white;
            width: 100%;
        }
        .question-panel { background: #1e2a3a; border-left: 8px solid #e67e22; }
        .players-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }
        .player-card {
            background: rgba(0,0,0,0.3);
            border-radius: 24px;
            padding: 12px;
            text-align: center;
        }
        .player-name { font-weight: bold; font-size: 1.1rem; }
        .player-score { font-size: 1.3rem; color: #f1c40f; }
        .answer-list {
            max-height: 300px;
            overflow-y: auto;
            margin: 10px 0;
        }
        .answer-item {
            background: rgba(255,255,255,0.1);
            margin: 5px 0;
            padding: 8px;
            border-radius: 16px;
        }
        .qr { display: inline-block; background: white; padding: 10px; border-radius: 20px; }
        @media (max-width: 700px) { .players-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
<div class="container">
    <div class="flex-between">
        <h1>🎤 LIVE QUIZ HOST</h1>
        <div id="session-info"></div>
    </div>

    <!-- Session erstellen -->
    <div class="card" id="setup-panel">
        <h2>1. Session starten</h2>
        <div class="flex-between">
            <input type="text" id="session-name" placeholder="Quiz-Name (z. B. 'Quiznight 2026')" style="width: 60%;">
            <button id="create-session">✨ Neue Session erstellen</button>
        </div>
        <div id="qr-container" style="margin-top: 20px; text-align: center;"></div>
        <div id="existing-sessions" style="margin-top: 15px;"></div>
    </div>

    <!-- Excel Upload -->
    <div class="card" id="upload-panel" style="display: none;">
        <h2>2. Fragen importieren</h2>
        <input type="file" id="excel-file" accept=".xlsx, .xls, .csv">
        <button id="upload-excel">📂 Hochladen & Fragen speichern</button>
        <div id="upload-status"></div>
    </div>

    <!-- Spielerübersicht -->
    <div class="card" id="players-panel" style="display: none;">
        <div class="flex-between">
            <h2>👥 Spieler (<span id="player-count">0</span>)</h2>
            <button id="next-question-btn" style="background: #2ecc71;">➡️ Nächste Frage</button>
        </div>
        <div class="players-grid" id="players-list"></div>
    </div>

    <!-- Aktuelle Frage & Antworten -->
    <div class="card question-panel" id="question-panel" style="display: none;">
        <h2 id="question-text">Frage wird geladen...</h2>
        <div id="question-image" style="text-align: center; margin: 10px;"></div>
        <div id="question-options"></div>
        <div class="flex-between">
            <span>⏱️ <span id="timer-display">--</span> Sekunden</span>
            <button id="evaluate-btn" style="background: #f39c12;">📊 Auswerten & Punkte vergeben</button>
        </div>
        <div id="answers-list" class="answer-list"></div>
        <button id="manual-adjust" style="background: #3498db; margin-top: 10px;">✏️ Manuelle Punkteanpassung (Moderator)</button>
    </div>
</div>

<script>
    // Supabase – DEINE NEUEN ZUGANGSDATEN
    const SUPABASE_URL = 'https://xvnhtfmedzjblinchzmt.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_8wS4n-07wc2SCmniuTdYmA_uRIlNE4z';
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let currentSessionId = null;
    let currentQuestions = [];
    let currentQuestionIndex = 0;
    let currentScoringRule = null;
    let currentQuestionType = null;
    let currentAnswers = [];

    function showPanel(id) { document.getElementById(id).style.display = 'block'; }
    function hidePanel(id) { document.getElementById(id).style.display = 'none'; }

    // Session erstellen
    document.getElementById('create-session').onclick = async () => {
        const name = document.getElementById('session-name').value || "Quiz-Session";
        const { data, error } = await supabase.from('quiz_sessions').insert({ session_name: name, is_active: true, current_question_index: 0 }).select().single();
        if (error) { alert("Fehler: " + error.message); return; }
        currentSessionId = data.id;
        localStorage.setItem('livequiz_session', currentSessionId);
        const joinUrl = `${window.location.origin}${window.location.pathname.replace('host.html', 'join.html')}?session=${currentSessionId}`;
        document.getElementById('qr-container').innerHTML = `<div class="qr" id="qrcode"></div><p>Scannen zum Beitreten</p><a href="${joinUrl}" target="_blank">Direktlink</a>`;
        new QRCode(document.getElementById("qrcode"), { text: joinUrl, width: 150, height: 150 });
        document.getElementById('session-info').innerHTML = `<strong>Session-ID:</strong> ${currentSessionId} | Name: ${name}`;
        hidePanel('setup-panel');
        showPanel('upload-panel');
        loadExistingPlayers();
        subscribeToPlayers();
    };

    // Excel Upload
    document.getElementById('upload-excel').onclick = async () => {
        const file = document.getElementById('excel-file').files[0];
        if (!file) return alert("Bitte Datei auswählen");
        const reader = new FileReader();
        reader.onload = async (e) => {
            const data = new Uint8Array(e.target.result);
            const wb = XLSX.read(data, { type: 'array' });
            const sheet = wb.Sheets[wb.SheetNames[0]];
            const rows = XLSX.utils.sheet_to_json(sheet);
            for (let i = 0; i < rows.length; i++) {
                const r = rows[i];
                const question = {
                    session_id: currentSessionId,
                    question_text: r.Frage,
                    question_type: r.Typ,
                    correct_answer: String(r.Antwort),
                    options: r.Optionen || null,
                    image_url: r['Bild-URL'] || null,
                    time_limit: r['Zeit (Sek.)'] || 30,
                    scoring_rule: r.Punktregel || (r.Typ === 'Schätzung' ? '{"1":1,"2":0.5}' : '{"exakt":1}'),
                    order_index: i,
                    strict_order: r['Reihenfolge wichtig'] === 'Ja'
                };
                await supabase.from('quiz_questions').upsert(question);
            }
            document.getElementById('upload-status').innerHTML = `${rows.length} Fragen geladen!`;
            const { data: qs } = await supabase.from('quiz_questions').select('*').eq('session_id', currentSessionId).order('order_index');
            currentQuestions = qs;
            currentQuestionIndex = 0;
            hidePanel('upload-panel');
            showPanel('players-panel');
            showPanel('question-panel');
            loadCurrentQuestion();
        };
        reader.readAsArrayBuffer(file);
    };

    async function loadCurrentQuestion() {
        if (currentQuestionIndex >= currentQuestions.length) {
            alert("Quiz beendet! Endauswertung folgt.");
            return;
        }
        const q = currentQuestions[currentQuestionIndex];
        currentScoringRule = JSON.parse(q.scoring_rule);
        currentQuestionType = q.question_type;
        document.getElementById('question-text').innerText = q.question_text;
        if (q.image_url) document.getElementById('question-image').innerHTML = `<img src="${q.image_url}" style="max-width: 100%; max-height: 300px; border-radius: 20px;">`;
        else document.getElementById('question-image').innerHTML = '';
        if (q.question_type === 'MultipleChoice' && q.options) {
            const opts = q.options.split(';');
            let html = '<div class="flex-between" style="flex-wrap:wrap; gap:10px;">';
            opts.forEach(opt => { html += `<button class="btn" style="background:#3498db;" disabled>${opt}</button>`; });
            html += '</div>';
            document.getElementById('question-options').innerHTML = html;
        } else {
            document.getElementById('question-options').innerHTML = '';
        }
        document.getElementById('timer-display').innerText = q.time_limit;
        let seconds = q.time_limit;
        const timer = setInterval(() => {
            seconds--;
            document.getElementById('timer-display').innerText = seconds;
            if (seconds <= 0) clearInterval(timer);
        }, 1000);
        loadAnswersForCurrentQuestion();
    }

    async function loadAnswersForCurrentQuestion() {
        const qid = currentQuestions[currentQuestionIndex].id;
        const { data, error } = await supabase.from('quiz_answers').select('*, players(player_name)').eq('question_id', qid);
        if (data) {
            currentAnswers = data;
            renderAnswers(data);
        }
        supabase.channel(`answers-${qid}`).on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'quiz_answers', filter: `question_id=eq.${qid}` }, payload => {
            loadAnswersForCurrentQuestion();
        }).subscribe();
    }

    function renderAnswers(answers) {
        const container = document.getElementById('answers-list');
        container.innerHTML = answers.map(a => `<div class="answer-item">${a.players.player_name}: ${a.answer_text}</div>`).join('');
    }

    // Auswertung
    document.getElementById('evaluate-btn').onclick = async () => {
        const q = currentQuestions[currentQuestionIndex];
        const answers = currentAnswers;
        if (currentQuestionType === 'Schätzung') {
            const correctNum = parseFloat(q.correct_answer);
            const withDiff = answers.map(a => ({ ...a, diff: Math.abs(parseFloat(a.answer_text) - correctNum) }));
            withDiff.sort((a,b) => a.diff - b.diff);
            const firstDiff = withDiff[0]?.diff;
            const secondDiff = withDiff[1]?.diff;
            for (let a of withDiff) {
                let points = 0;
                if (a.diff === firstDiff) points = 1;
                else if (a.diff === secondDiff) points = 0.5;
                await supabase.from('quiz_answers').update({ score_awarded: points, is_correct: points>0 }).eq('id', a.id);
            }
        } else if (currentQuestionType === 'Aufzählung') {
            const correctList = q.correct_answer.split(';').map(s => s.trim().toLowerCase());
            const strict = q.strict_order;
            for (let ans of answers) {
                let points = 0;
                const userList = ans.answer_text.split(';').map(s => s.trim().toLowerCase());
                if (strict) {
                    let correctPositions = 0;
                    for (let i=0; i<Math.min(correctList.length, userList.length); i++) {
                        if (correctList[i] === userList[i]) correctPositions++;
                    }
                    points = correctPositions / correctList.length;
                } else {
                    const set = new Set(correctList);
                    const correctCount = userList.filter(item => set.has(item)).length;
                    points = correctCount / correctList.length;
                }
                await supabase.from('quiz_answers').update({ score_awarded: points, is_correct: points>0 }).eq('id', ans.id);
            }
        } else {
            for (let ans of answers) {
                const isCorrect = ans.answer_text.trim().toLowerCase() === q.correct_answer.trim().toLowerCase();
                const points = isCorrect ? 1 : 0;
                await supabase.from('quiz_answers').update({ score_awarded: points, is_correct: isCorrect }).eq('id', ans.id);
            }
        }
        // Spieler-Gesamtpunktzahl aktualisieren
        const players = await supabase.from('quiz_players').select('id').eq('session_id', currentSessionId);
        for (let p of players.data) {
            const { data: scores } = await supabase.from('quiz_answers').select('score_awarded').eq('player_id', p.id);
            const total = scores.reduce((sum, s) => sum + (s.score_awarded || 0), 0);
            await supabase.from('quiz_players').update({ total_score: total }).eq('id', p.id);
        }
        alert("Auswertung abgeschlossen!");
        currentQuestionIndex++;
        if (currentQuestionIndex < currentQuestions.length) loadCurrentQuestion();
        else alert("Quiz fertig!");
    };

    // Spielerliste laden
    async function loadExistingPlayers() {
        const { data } = await supabase.from('quiz_players').select('*').eq('session_id', currentSessionId);
        renderPlayers(data);
    }
    function renderPlayers(players) {
        const container = document.getElementById('players-list');
        container.innerHTML = players.map(p => `<div class="player-card"><div class="player-name">${p.player_name}</div><div class="player-score">${p.total_score || 0} Pkt</div></div>`).join('');
        document.getElementById('player-count').innerText = players.length;
    }
    function subscribeToPlayers() {
        supabase.channel('players').on('postgres_changes', { event: '*', schema: 'public', table: 'quiz_players', filter: `session_id=eq.${currentSessionId}` }, () => {
            loadExistingPlayers();
        }).subscribe();
    }

    // Manuelle Punkteanpassung (vereinfacht)
    document.getElementById('manual-adjust').onclick = () => {
        const playerName = prompt("Spielername eingeben:");
        const newPoints = parseFloat(prompt("Neue Punktzahl für diese Frage (0-1):"));
        if (playerName && !isNaN(newPoints)) {
            alert("Manuelle Anpassung: Bitte in Supabase-UI oder erweiterter Dialog folgt.");
        }
    };

    // Session wiederherstellen
    window.onload = () => {
        const saved = localStorage.getItem('livequiz_session');
        if (saved) {
            currentSessionId = saved;
            document.getElementById('session-info').innerHTML = `Aktive Session: ${saved}`;
            hidePanel('setup-panel');
            showPanel('upload-panel');
            loadExistingPlayers();
            subscribeToPlayers();
        }
    };
</script>
</body>
</html>
