<!DOCTYPE html>
<html>
<head><title>Minimal Button</title></head>
<body>
<button id="btn">Klick mich</button>
<pre id="out">--</pre>
<script>
    document.getElementById('btn').onclick = function() {
        document.getElementById('out').innerText = "Button wurde geklickt! (Kein Supabase)";
    };
</script>
</body>
</html>
