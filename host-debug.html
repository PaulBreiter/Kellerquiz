<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Host Debug (korrigiert)</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: monospace; padding: 20px; background: #f0f0f0; }
        button { padding: 10px 20px; margin: 10px 0; }
        .log { background: #fff; padding: 10px; border-radius: 8px; font-family: monospace; white-space: pre-wrap; }
        .error { color: red; }
    </style>
</head>
<body>
<h2>🎤 Host Debug (mit Fehlerfang)</h2>
<button id="createBtn">✨ Neue Session erstellen</button>
<div id="log" class="log">Bereit. Klicke den Button.</div>

<script>
    (function() {
        const SUPABASE_URL = 'https://xvnhtfmedzjblinchzmt.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_8wS4n-07wc2SCmniuTdYmA_uRIlNE4z';
        
        let supabase;
        try {
            supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
            document.getElementById('log').innerHTML = "✅ Supabase-Client erstellt. Klicke den Button.";
        } catch (err) {
            document.getElementById('log').innerHTML = `<span class="error">❌ Fehler beim Erstellen des Supabase-Clients: ${err.message}</span>`;
            return;
        }

        document.getElementById('createBtn').onclick = async () => {
            const logDiv = document.getElementById('log');
            logDiv.innerHTML = "🔄 Starte Session-Erstellung...";
            const sessionName = "Test " + new Date().toLocaleTimeString();
            try {
                const { data, error } = await supabase
                    .from('quiz_sessions')
                    .insert({ session_name: sessionName, is_active: true, current_question_index: 0 })
                    .select()
                    .single();
                if (error) throw error;
                logDiv.innerHTML = `✅ Session erstellt! ID: ${data.id}, Name: ${data.session_name}<br>👉 Link: ${window.location.origin}${window.location.pathname.replace('host-debug.html', 'join.html')}?session=${data.id}`;
            } catch (err) {
                logDiv.innerHTML = `<span class="error">❌ FEHLER: ${err.message}</span>`;
            }
        };
    })();
</script>
</body>
</html>
