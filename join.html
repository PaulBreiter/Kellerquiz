<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>KELLERQUIZ – Spieler</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; margin: 0; }
        body {
            font-family: 'Fredoka', 'Segoe UI', system-ui;
            background: linear-gradient(145deg, #fef9e8, #fff4e0);
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .card {
            background: white;
            border-radius: 48px;
            padding: 2rem;
            max-width: 550px;
            width: 100%;
            text-align: center;
            border: 4px solid #2d3436;
            box-shadow: 12px 12px 0 #dfe6e9;
        }
        input, button {
            width: 100%;
            padding: 14px;
            margin: 12px 0;
            border-radius: 60px;
            border: 2px solid #2d3436;
            font-size: 1rem;
        }
        button {
            background: #6c5ce7;
            color: white;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 4px 4px 0 #2d3436;
            transition: 0.1s;
        }
        button:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 #2d3436; }
        .question { font-size: 1.5rem; margin: 20px 0; font-weight: bold; }
        .answer-input { background: #fef9e8; }
        .ranking { margin-top: 20px; text-align: left; background: #f0f2f5; border-radius: 24px; padding: 12px; }
        img { max-width: 100%; border-radius: 20px; margin: 10px 0; border: 2px solid #2d3436; }
    </style>
</head>
<body>
<div class="card" id="join-card">
    <h2>🎮 KELLERQUIZ BEITRETEN</h2>
    <input type="text" id="player-name" placeholder="Dein Name (Teamname)">
    <button id="join-btn">📱 Beitreten</button>
</div>
<div class="card" id="quiz-card" style="display: none;">
    <div id="current-question"></div>
    <div id="answer-area"></div>
    <div id="ranking-area" class="ranking"></div>
</div>
<script>
    const SUPABASE_URL = 'https://xvnhtfmedzjblinchzmt.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_8wS4n-07wc2SCmniuTdYmA_uRIlNE4z';
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const urlParams = new URLSearchParams(window.location.search);
    const sessionId = urlParams.get('session');
    let playerId = null;
    let currentQuestion = null;

    document.getElementById('join-btn').onclick = async () => {
        const playerName = document.getElementById('player-name').value.trim();
        if (!playerName) return alert("Bitte Namen eingeben");
        if (!sessionId) return alert("Keine Session-ID – bitte QR-Code scannen");
        const { data, error } = await supabase.from('quiz_players').insert({ session_id: sessionId, player_name: playerName, total_score: 0 }).select().single();
        if (error) { alert("Fehler: " + error.message); return; }
        playerId = data.id;
        document.getElementById('join-card').style.display = 'none';
        document.getElementById('quiz-card').style.display = 'block';
        subscribeToQuestions();
    };

    async function subscribeToQuestions() {
        const { data: session } = await supabase.from('quiz_sessions').select('current_question_index').eq('id', sessionId).single();
        const { data: questions } = await supabase.from('quiz_questions').select('*').eq('session_id', sessionId).order('order_index');
        if (questions && questions[session.current_question_index]) {
            showQuestion(questions[session.current_question_index]);
        }
        supabase.channel('session-update').on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'quiz_sessions', filter: `id=eq.${sessionId}` }, payload => {
            const newIndex = payload.new.current_question_index;
            if (questions && questions[newIndex]) showQuestion(questions[newIndex]);
        }).subscribe();
    }

    function showQuestion(q) {
        currentQuestion = q;
        let html = `<div class="question">${q.question_text}</div>`;
        if (q.image_url) html += `<img src="${q.image_url}" alt="Bild">`;
        document.getElementById('current-question').innerHTML = html;
        let inputHtml = '';
        if (q.question_type === 'MultipleChoice' && q.options) {
            const opts = q.options.split(';');
            inputHtml = '<div>';
            opts.forEach(opt => {
                inputHtml += `<button style="display:block; width:100%; margin:8px 0; background:#00b894;" onclick="sendAnswer('${opt.replace(/'/g, "\\'")}')">${opt}</button>`;
            });
            inputHtml += '</div>';
        } else {
            inputHtml = `<input type="text" id="free-answer" class="answer-input" placeholder="Deine Antwort"><button onclick="sendAnswer(document.getElementById('free-answer').value)">📨 Absenden</button>`;
        }
        document.getElementById('answer-area').innerHTML = inputHtml;
    }

    async function sendAnswer(answer) {
        if (!answer) return;
        await supabase.from('quiz_answers').insert({
            player_id: playerId,
            question_id: currentQuestion.id,
            answer_text: answer,
            score_awarded: 0,
            is_correct: false
        });
        alert("✅ Antwort gespeichert!");
        if (document.getElementById('free-answer')) document.getElementById('free-answer').value = '';
    }

    async function updateRanking() {
        const { data } = await supabase.from('quiz_players').select('player_name, total_score').eq('session_id', sessionId).order('total_score', { ascending: false });
        let html = '<h3>🏆 Punktestand</h3>';
        data.forEach(p => html += `<div><strong>${p.player_name}</strong>: ${p.total_score} Punkte</div>`);
        document.getElementById('ranking-area').innerHTML = html;
    }
    setInterval(updateRanking, 2000);
    updateRanking();
</script>
</body>
</html>
