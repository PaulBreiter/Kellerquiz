<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Mini Host</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <h2>Mini Host</h2>
    <button id="create">Session erstellen</button>
    <pre id="log">bereit</pre>

    <script>
        const SUPABASE_URL = 'https://xvnhtfmedzjblinchzmt.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_8wS4n-07wc2SCmniuTdYmA_uRIlNE4z';
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        const log = document.getElementById('log');

        document.getElementById('create').onclick = async () => {
            log.innerText = "Versuche Session zu erstellen...";
            try {
                const { data, error } = await supabase
                    .from('quiz_sessions')
                    .insert({ session_name: "TestSession", is_active: true, current_question_index: 0 })
                    .select();
                if (error) throw error;
                log.innerText = "✅ Erfolg! Session ID: " + JSON.stringify(data);
            } catch (err) {
                log.innerText = "❌ Fehler: " + err.message;
                console.error(err);
            }
        };
    </script>
</body>
</html>
